[package]
name = "grandaddy-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Grandaddy — manage your vibe coding sessions. All in one place."

[lib]
name = "grandaddy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
grandaddy-core = { version = "0.3.0", path = "../../crates/grandaddy-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["image-png", "macos-private-api", "tray-icon"] }
tiny_http = "0.12"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }
