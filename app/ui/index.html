<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grandaddy</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar: sits on the window's native translucent material -->
    <aside class="sidebar">
      <div class="sidebar-top" data-tauri-drag-region></div>
      <div class="brand" data-tauri-drag-region>
        <img src="assets/icon.png" alt="" class="brand-icon">
        <div>
          <div class="brand-name">Grandaddy</div>
          <div class="brand-sub" id="brand-sub">Watching your sessions</div>
        </div>
      </div>

      <label class="search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
        <input id="filter" type="search" placeholder="Search sessions" autocomplete="off" spellcheck="false">
      </label>

      <nav class="session-groups" id="groups" aria-label="Sessions"></nav>

      <nav class="views" aria-label="Views">
        <button class="view-btn" data-view="history"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg>History</button>
        <button class="view-btn" data-view="usage"><svg viewBox="0 0 16 16"><path d="M3 13V8M8 13V3M13 13V6"/></svg>Usage</button>
        <button class="view-btn" data-view="rules"><svg viewBox="0 0 16 16"><path d="M3 4h10M3 8h10M3 12h6"/></svg>Rules</button>
        <button class="view-btn" data-view="settings"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4 5 11M11 5l1.4-1.4"/></svg>Settings</button>
      </nav>
    </aside>

    <!-- Content -->
    <main class="content">
      <header class="toolbar" data-tauri-drag-region>
        <div class="toolbar-title" id="toolbar-title" data-tauri-drag-region></div>
        <div class="capsule" id="session-actions" hidden>
          <button class="tb-btn" id="btn-open" title="Jump to its terminal"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="m5 7 2 1.5L5 10M8.5 10.5H11"/></svg><span id="btn-open-label">Open</span></button>
          <button class="tb-btn" id="btn-auto" title="Approve this session's permission prompts automatically"><svg viewBox="0 0 16 16"><path d="M9 2 4 9h4l-1 5 5-7H8z"/></svg><span>Auto-yes</span></button>
          <button class="tb-btn danger" id="btn-stop" title="Stop this background session" hidden><svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1.5"/></svg><span>Stop</span></button>
        </div>
        <div class="capsule">
          <button class="tb-btn primary" id="btn-new" title="Start a new session (⌘N)"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg><span>New Session</span></button>
        </div>
      </header>

      <section class="pane" id="pane"></section>
    </main>
  </div>

  <!-- New session sheet -->
  <div class="scrim" id="scrim" hidden></div>
  <form class="sheet" id="sheet" hidden autocomplete="off">
    <h2>New session</h2>
    <p class="sheet-sub">Starts Claude Code in the background. It shows up in your sessions, and anything it asks lands here.</p>
    <label class="field"><span>Folder</span><input id="new-cwd" required spellcheck="false"></label>
    <label class="field"><span>What should it do?</span><textarea id="new-prompt" rows="4" required placeholder="Fix the flaky login test and explain what was wrong"></textarea></label>
    <div class="field-row">
      <label class="toggle"><input type="checkbox" id="new-wt"><span class="switch"></span>Work in a new git worktree</label>
      <label class="field inline"><span>Model</span>
        <select id="new-model"><option value="">Default</option><option value="opus">Opus</option><option value="sonnet">Sonnet</option><option value="haiku">Haiku</option></select>
      </label>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn" id="new-cancel">Cancel</button>
      <button type="submit" class="btn primary" id="new-go">Start</button>
    </div>
  </form>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
