<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grandaddy</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Launch screen: shown until the first sessions, settings and agents have loaded -->
  <div class="splash" id="splash" role="progressbar" aria-label="Loading Grandaddy">
    <div class="splash-inner">
      <img src="assets/icon.png" alt="">
      <h1>Grandaddy</h1>
      <div class="bar"><i id="splash-bar"></i></div>
      <div class="step" id="splash-step">Starting…</div>
    </div>
  </div>
  <div class="progress" id="progress"><i></i></div>

  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top" data-tauri-drag-region></div>
      <div class="brand" data-tauri-drag-region>
        <img src="assets/icon.png" alt="">
        <div><div class="name">Grandaddy</div><div class="sub" id="brand-sub">Looking…</div></div>
      </div>
      <label class="search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
        <input id="filter" type="search" placeholder="Search sessions" autocomplete="off" spellcheck="false">
        <kbd>⌘F</kbd>
      </label>
      <nav class="source-list" id="groups" aria-label="Sessions"></nav>
      <nav class="source-list library" aria-label="Library">
        <button class="row-btn" data-view="goals"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="3"/><circle cx="8" cy="8" r=".7" fill="currentColor"/></svg>Goals</button>
        <button class="row-btn" data-view="loops"><svg viewBox="0 0 16 16"><path d="M3 7a5 5 0 0 1 9-2.6M13 9a5 5 0 0 1-9 2.6"/><path d="M12.2 1.8v2.8H9.4M3.8 14.2v-2.8h2.8"/></svg>Loops</button>
        <button class="row-btn" data-view="history"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg>History</button>
        <button class="row-btn" data-view="usage"><svg viewBox="0 0 16 16"><path d="M3 13V8M8 13V3M13 13V6"/></svg>Usage</button>
        <button class="row-btn" data-view="rules"><svg viewBox="0 0 16 16"><path d="M8 1.8 3 3.8v4c0 3 2.2 5.2 5 6.4 2.8-1.2 5-3.4 5-6.4v-4z"/></svg>Rules</button>
        <button class="row-btn" data-view="settings"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4 5 11M11 5l1.4-1.4"/></svg>Settings</button>
      </nav>
    </aside>

    <main class="content">
      <header class="toolbar" data-tauri-drag-region>
        <div class="toolbar-title" data-tauri-drag-region>
          <div class="title" id="title" data-tauri-drag-region></div>
          <div class="subtitle" id="subtitle" data-tauri-drag-region></div>
        </div>
        <div class="segmented" id="tabs" hidden role="tablist">
          <span class="lens"></span>
          <button data-tab="activity" role="tab">Activity</button>
          <button data-tab="git" role="tab">Git</button>
        </div>
        <div class="capsule" id="session-tools" hidden>
          <span class="divider-v"></span>
          <button class="tool" id="btn-open" data-tip="Show its window"><svg viewBox="0 0 16 16"><path d="M9 2.5h4.5V7M13.5 2.5 7.5 8.5M11.5 9.5v3a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3"/></svg></button>
          <button class="tool" id="btn-auto" data-tip="Auto-yes"><svg viewBox="0 0 16 16"><path d="M9 2 4 9h4l-1 5 5-7H8z"/></svg></button>
          <button class="tool" id="btn-stop" data-tip="Stop" hidden><svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1.8"/></svg></button>
        </div>
        <div class="capsule">
          <span class="divider-v"></span>
          <button class="tool" id="btn-new" data-tip="New Session  ⌘N"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
        </div>
      </header>

      <section class="pane" id="pane"></section>

      <!-- The message field; redraws never touch what you type -->
      <form class="composer" id="composer" hidden autocomplete="off">
        <div class="palette" id="palette" hidden></div>
        <div class="menu" id="menu" hidden></div>
        <div class="controls" id="controls" hidden></div>
        <div class="composer-field">
          <textarea id="composer-text" rows="1" placeholder="Message" spellcheck="true"></textarea>
          <button class="send" id="composer-send" type="submit" disabled>Send <svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
        </div>
        <div class="composer-hint" id="composer-hint"></div>
      </form>
    </main>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <form class="sheet" id="sheet" hidden autocomplete="off">
    <h2>New Session</h2>
    <p class="sheet-lead">Claude Code starts in the background. It appears in your sessions, and anything it asks shows up here and on your phone.</p>
    <div class="form-grid">
      <label for="new-cwd">Folder</label>
      <input id="new-cwd" required spellcheck="false">
      <label for="new-prompt">Task</label>
      <textarea id="new-prompt" rows="4" required placeholder="Fix the flaky login test and explain what was wrong"></textarea>
      <label for="new-model">Model</label>
      <select id="new-model"><option value="">Default</option><option value="opus">Opus</option><option value="sonnet">Sonnet</option><option value="haiku">Haiku</option></select>
      <span></span>
      <label class="check"><input type="checkbox" id="new-wt"> Work in a new git worktree</label>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn" id="new-cancel">Cancel</button>
      <button type="submit" class="btn default" id="new-go">Start Session</button>
    </div>
  </form>

  <div class="alert" id="alert" hidden role="alertdialog" aria-modal="true">
    <img src="assets/icon.png" alt="" class="alert-icon">
    <h3 id="alert-title"></h3>
    <p id="alert-body"></p>
    <div class="alert-actions">
      <button class="btn" id="alert-cancel">Cancel</button>
      <button class="btn default" id="alert-ok"></button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
